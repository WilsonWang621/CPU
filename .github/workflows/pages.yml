name: Publish project showcase

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build showcase site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble selected Pages files
        run: |
          rm -rf _site
          mkdir -p _site/architecture
          cp docs/site/index.html _site/index.html
          cp docs/architecture/dual-issue-overview.html _site/architecture/
          cp docs/architecture/dual-issue-overview.json _site/architecture/
          cp docs/architecture/dual-issue-overview.gif _site/architecture/
          cp docs/architecture/single-issue-overview.html _site/architecture/
          cp docs/architecture/single-issue-overview.json _site/architecture/
          cp docs/architecture/single-issue-overview.gif _site/architecture/
          sed -i 's#../architecture/#./architecture/#g' _site/index.html
          test -s _site/index.html
          test -s _site/architecture/dual-issue-overview.html
          test -s _site/architecture/single-issue-overview.html
          ! rg -n '(/home/|/Users/|[A-Za-z]:\\\\)' _site
          test "$(find _site -type f | wc -l)" -eq 7
      - name: Resolve repository links and check showcase targets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          from urllib.parse import unquote, urlsplit
          root = Path('_site')
          index = root/'index.html'
          repository = os.environ['GITHUB_REPOSITORY']
          text = index.read_text().replace(
              'https://github.com/WilsonWang621/CPU',
              f'https://github.com/{repository}')
          index.write_text(text)
          for href in re.findall(r'href="([^"]+)"', text):
              url = urlsplit(href)
              if url.netloc == 'github.com':
                  parts = unquote(url.path).strip('/').split('/')
                  assert '/'.join(parts[:2]).casefold() == repository.casefold(), f'Wrong repository: {href}'
                  target = parts[2:]
                  if not target or target == ['actions']:
                      continue
                  assert len(target) >= 3 and target[0] in ('blob', 'tree') and target[1] == 'main', href
                  path = Path('/'.join(target[2:]))
                  assert not path.is_absolute() and '..' not in path.parts, href
                  assert (path.is_file() if target[0] == 'blob' else path.is_dir()), f'Missing repository target: {href}'
              elif href.startswith('#'):
                  continue
              else:
                  assert not url.scheme and not url.netloc and not url.path.startswith('/'), href
                  assert (root/unquote(url.path)).is_file(), href
          print(f'showcase links: PASS (local assets and {repository} targets)')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy showcase to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
